        function KioskModule({ stores, employees, isOffline, onRecordAttendance, showToast }) {
            const [step, setStep] = useState(1); // Step 1: Selection Form, Step 2: Camera Capture
            const [attendanceType, setAttendanceType] = useState('CHECK_IN');
            
            // Selected fields
            const [selectedEmpId, setSelectedEmpId] = useState(employees[0]?.id || '');
            const [selectedStoreId, setSelectedStoreId] = useState(stores[0]?.id || '');
            const [selectedShift, setSelectedShift] = useState('');

            const [isScanning, setIsScanning] = useState(false);
            const [scanSuccess, setScanSuccess] = useState(false);
            const [lastRecord, setLastRecord] = useState(null);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [useRealCamera, setUseRealCamera] = useState(false);
            const [cameraStream, setCameraStream] = useState(null);

            // Get selected Employee & Store Details
            const selectedEmp = employees.find(e => e.id === selectedEmpId) || employees[0];
            const isDriver = selectedEmp?.isDriver || selectedEmp?.role?.toLowerCase().includes('driver') || selectedEmp?.role?.toLowerCase().includes('supir');
            
            const selectedStore = stores.find(s => s.id === selectedStoreId) || stores[0];
            const availableShifts = selectedStore?.shifts || ['Shift Pagi (08:00 - 16:00)', 'Shift Siang (12:00 - 20:00)'];

            // Auto-update Store & Shift defaults when staff changes
            useEffect(() => {
                if (selectedEmp) {
                    if (selectedEmp.storeId) setSelectedStoreId(selectedEmp.storeId);
                    if (selectedEmp.shift) setSelectedShift(selectedEmp.shift);
                }
            }, [selectedEmpId]);

            // When store changes, update default shift if current shift not valid
            useEffect(() => {
                if (availableShifts.length > 0 && !availableShifts.includes(selectedShift)) {
                    setSelectedShift(availableShifts[0]);
                }
            }, [selectedStoreId]);

            // Manage camera stream when stepping into step 2
            const startWebcam = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    setCameraStream(stream);
                    setUseRealCamera(true);
                } catch (err) {
                    setUseRealCamera(false);
                }
            };

            const stopWebcam = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    setCameraStream(null);
                }
            };

            useEffect(() => {
                if (step === 2) {
                    startWebcam();
                } else {
                    stopWebcam();
                }
                return () => stopWebcam();
            }, [step]);

            const handleProceedToCamera = () => {
                if (!isDriver && (!selectedStoreId || !selectedShift)) {
                    showToast('Harap lengkapi pilihan Store dan Shift terlebih dahulu!', 'warning');
                    return;
                }
                setStep(2);
                setScanSuccess(false);
            };

            const handleSimulateScan = () => {
                setIsScanning(true);

                let capturedPhotoUrl = selectedEmp?.masterPhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400';
                if (useRealCamera && videoRef.current && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const video = videoRef.current;
                    canvas.width = video.videoWidth || 300;
                    canvas.height = video.videoHeight || 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    capturedPhotoUrl = canvas.toDataURL('image/jpeg');
                }

                setTimeout(() => {
                    setIsScanning(false);
                    setScanSuccess(true);

                    const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
                    const matchConfidence = Number((96.5 + Math.random() * 3.2).toFixed(1));

                    const record = {
                        id: `ATT-${Math.floor(1000 + Math.random() * 9000)}`,
                        employeeId: selectedEmp.id,
                        employeeName: selectedEmp.name,
                        masterPhotoRef: selectedEmp.masterPhoto,
                        capturedPhoto: capturedPhotoUrl,
                        storeName: isDriver ? 'Mobile Delivery / Central Kitchen' : selectedStore.name,
                        shiftName: isDriver ? 'Direct Driver Delivery' : selectedShift,
                        role: selectedEmp.role,
                        checkIn: attendanceType === 'CHECK_IN' ? nowStr : '2026-08-02 08:00:00',
                        checkOut: attendanceType === 'CHECK_OUT' ? nowStr : null,
                        attendanceType: attendanceType,
                        isLate: false,
                        lateMinutes: 0,
                        confidence: matchConfidence,
                        matchStatus: 'MATCHED',
                        livenessScore: 98.4,
                        device: isDriver ? 'Kiosk Supir Mobile' : `Kiosk ${selectedStore.name}`
                    };

                    setLastRecord(record);
                    onRecordAttendance(record);

                    setTimeout(() => {
                        setStep(1);
                        setScanSuccess(false);
                    }, 3500);
                }, 2000);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    {/* Header Banner */}
                    <div className="bg-gradient-to-r from-brand-700 via-brand-600 to-chocolate-700 text-white p-6 rounded-3xl shadow-lg relative overflow-hidden">
                        <div className="relative z-10 flex justify-between items-center">
                            <div>
                                <span className="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[11px] font-extrabold uppercase tracking-wider">
                                    Absensi Kiosk AI
                                </span>
                                <h2 className="text-xl font-black mt-2">PUDING PANEN BALI</h2>
                                <p className="text-xs text-brand-100">
                                    {isDriver ? '🚚 Mode Special Driver / Supir' : (selectedStore?.name || 'Outlet Puding Panen Bali')}
                                </p>
                            </div>
                            <div className="text-right">
                                <span className="text-xs bg-white text-brand-800 font-black px-3 py-1 rounded-xl shadow-sm">
                                    {step === 1 ? 'LANGKAH 1: PILIH DATA' : 'LANGKAH 2: FOTO ABSEN'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* STEP 1: PILIHAN STAFF, STORE, SHIFT (DENGAN DIRECT MODE UNTUK SUPIR) */}
                    {step === 1 && (
                        <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-6">
                            
                            <div className="text-center space-y-1">
                                <h3 className="text-lg font-black text-slate-800">Pilih Data Presensi Staff</h3>
                                <p className="text-xs text-slate-500">Silakan pilih nama staff, outlet, dan shift kerja Anda</p>
                            </div>

                            {/* Presensi Check-in / Check-out Switcher */}
                            <div className="grid grid-cols-2 gap-3">
                                <button
                                    type="button"
                                    onClick={() => setAttendanceType('CHECK_IN')}
                                    className={`p-3.5 rounded-2xl border text-center transition-all flex items-center justify-center gap-2 ${
                                        attendanceType === 'CHECK_IN'
                                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-300'
                                            : 'bg-cream-50 text-slate-700 border-cream-300 hover:bg-cream-100'
                                    }`}
                                >
                                    <span className="text-lg">🟢</span>
                                    <span className="font-extrabold text-xs">Absen Masuk</span>
                                </button>

                                <button
                                    type="button"
                                    onClick={() => setAttendanceType('CHECK_OUT')}
                                    className={`p-3.5 rounded-2xl border text-center transition-all flex items-center justify-center gap-2 ${
                                        attendanceType === 'CHECK_OUT'
                                            ? 'bg-brand-600 text-white border-brand-600 shadow-md ring-2 ring-brand-300'
                                            : 'bg-cream-50 text-slate-700 border-cream-300 hover:bg-cream-100'
                                    }`}
                                >
                                    <span className="text-lg">🔴</span>
                                    <span className="font-extrabold text-xs">Absen Pulang</span>
                                </button>
                            </div>

                            {/* Dropdown Section */}
                            <div className="space-y-4 text-xs">
                                
                                {/* 1. PILIH NAMA STAFF */}
                                <div>
                                    <label className="block font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                        <span>👤</span> 1. Pilih Nama Staff / Karyawan
                                    </label>
                                    <select
                                        value={selectedEmpId}
                                        onChange={(e) => setSelectedEmpId(e.target.value)}
                                        className="w-full bg-cream-50 border border-cream-300 rounded-2xl p-3.5 text-sm font-bold text-slate-800 outline-none focus:border-brand-600 transition-all shadow-sm"
                                    >
                                        {employees.map(emp => (
                                            <option key={emp.id} value={emp.id}>
                                                {emp.name} {emp.isDriver ? '🚚 (Supir)' : `— ${emp.role}`}
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                {/* SPECIAL DRIVER NOTIFICATION / DIRECT MODE BANNER */}
                                {isDriver ? (
                                    <div className="p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl space-y-2 animate-pulse">
                                        <div className="flex items-center gap-2 font-extrabold text-amber-900 text-sm">
                                            <span>🚚</span>
                                            <span>STAFF SUPIR / DRIVER TERDETEKSI!</span>
                                        </div>
                                        <p className="text-amber-800 text-xs leading-relaxed font-medium">
                                            Khusus Supir Delivery, Anda <strong>langsung diarahkan untuk foto absensi</strong> tanpa perlu mengisi pilihan Store dan Shift!
                                        </p>
                                    </div>
                                ) : (
                                    <>
                                        {/* 2. PILIH STORE / OUTLET (REGULAR STAFF) */}
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                                <span>🏪</span> 2. Pilih Store / Outlet Toko
                                            </label>
                                            <select
                                                value={selectedStoreId}
                                                onChange={(e) => setSelectedStoreId(e.target.value)}
                                                className="w-full bg-cream-50 border border-cream-300 rounded-2xl p-3.5 text-sm font-bold text-slate-800 outline-none focus:border-brand-600 transition-all shadow-sm"
                                            >
                                                {stores.map(st => (
                                                    <option key={st.id} value={st.id}>
                                                        {st.name} ({st.code})
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* 3. PILIH SHIFT (REGULAR STAFF) */}
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
                                                <span>⏰</span> 3. Pilih Shift Kerja
                                            </label>
                                            <select
                                                value={selectedShift}
                                                onChange={(e) => setSelectedShift(e.target.value)}
                                                className="w-full bg-cream-50 border border-cream-300 rounded-2xl p-3.5 text-sm font-bold text-slate-800 outline-none focus:border-brand-600 transition-all shadow-sm"
                                            >
                                                {availableShifts.map((sh, idx) => (
                                                    <option key={idx} value={sh}>
                                                        {sh}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    </>
                                )}

                                {/* Selected Preview Card */}
                                <div className="p-4 bg-cream-50 rounded-2xl border border-cream-200 flex items-center gap-3">
                                    <img src={selectedEmp?.masterPhoto} className="w-12 h-12 rounded-xl object-cover border border-cream-300 shrink-0" />
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-extrabold text-sm text-slate-900 truncate">{selectedEmp?.name}</h4>
                                        <p className="text-[11px] text-slate-500 font-medium truncate">
                                            {isDriver ? '🚚 Driver Delivery • Langsung Ambil Foto' : `${selectedStore?.name} • ${selectedShift}`}
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* MAIN ACTION BUTTON */}
                            {isDriver ? (
                                <button
                                    type="button"
                                    onClick={handleProceedToCamera}
                                    className="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-extrabold rounded-2xl shadow-lg transition-all text-sm flex items-center justify-center gap-2 ring-4 ring-amber-100"
                                >
                                    <span>🚚</span>
                                    <span>LANGSUNG FOTO ABSENSI SUPIR ➔</span>
                                </button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={handleProceedToCamera}
                                    className="w-full py-4 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-2xl shadow-lg transition-all text-sm flex items-center justify-center gap-2 ring-4 ring-brand-100"
                                >
                                    <span>📷</span>
                                    <span>LANJUT KE FOTO ABSENSI WAJAH ➔</span>
                                </button>
                            )}

                        </div>
                    )}

                    {/* STEP 2: CAMERA / AI SCANNER */}
                    {step === 2 && (
                        <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-6">
                            
                            <div className="flex justify-between items-center">
                                <button 
                                    onClick={() => setStep(1)}
                                    className="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1"
                                >
                                    ← Kembali Ubah Data
                                </button>
                                <span className={`text-xs font-bold px-3 py-1 rounded-full ${
                                    isDriver ? 'bg-amber-100 text-amber-900' : 'bg-emerald-100 text-emerald-900'
                                }`}>
                                    {isDriver ? '🚚 Presensi Supir' : '🏢 Presensi Staff Outlet'}
                                </span>
                            </div>

                            {/* Camera Area */}
                            <div className="bg-slate-900 rounded-3xl overflow-hidden aspect-square max-w-sm mx-auto relative border-4 border-slate-800 shadow-xl flex items-center justify-center">
                                
                                {useRealCamera ? (
                                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover"></video>
                                ) : (
                                    <div className="relative w-full h-full">
                                        <img src={selectedEmp?.masterPhoto} className="w-full h-full object-cover opacity-80" />
                                        <div className="absolute inset-0 bg-slate-900/30 backdrop-blur-[1px]"></div>
                                    </div>
                                )}
                                <canvas ref={canvasRef} className="hidden"></canvas>

                                {/* Scanner Visual Overlay */}
                                <div className="absolute inset-0 border-2 border-white/20 rounded-3xl flex flex-col items-center justify-between p-6">
                                    <div className="w-48 h-48 border-2 border-dashed border-emerald-400 rounded-full flex items-center justify-center relative">
                                        <div className="w-40 h-40 border border-emerald-500/50 rounded-full animate-ping"></div>
                                    </div>
                                    
                                    {isScanning ? (
                                        <div className="bg-slate-900/90 text-emerald-400 text-xs font-bold px-4 py-2 rounded-xl backdrop-blur-md animate-pulse">
                                            🔍 Memproses Verifikasi Wajah AI...
                                        </div>
                                    ) : scanSuccess ? (
                                        <div className="bg-emerald-600 text-white text-xs font-black px-4 py-2 rounded-xl shadow-lg">
                                            ✅ WAJAH TERCOCOKKAN 98.4%!
                                        </div>
                                    ) : (
                                        <div className="bg-slate-900/80 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg backdrop-blur-md">
                                            Posisikan Wajah Pas di Lingkaran
                                        </div>
                                    )}
                                </div>

                                {isScanning && <div className="scan-line"></div>}
                            </div>

                            {/* Scan Details & Action Button */}
                            <div className="space-y-3 max-w-sm mx-auto text-center">
                                <div className="p-3 bg-cream-50 rounded-xl border border-cream-200 text-xs text-slate-600">
                                    Karyawan: <strong>{selectedEmp?.name}</strong> • Tipe: <strong>{attendanceType}</strong>
                                </div>

                                <button
                                    type="button"
                                    onClick={handleSimulateScan}
                                    disabled={isScanning || scanSuccess}
                                    className={`w-full py-4 rounded-2xl font-black text-sm text-white shadow-lg transition-all flex items-center justify-center gap-2 ${
                                        scanSuccess ? 'bg-emerald-600' : 'bg-brand-600 hover:bg-brand-700'
                                    } disabled:opacity-50`}
                                >
                                    <span>📷</span>
                                    <span>{isScanning ? 'Memverifikasi Biometrik...' : scanSuccess ? 'Presensi Berhasil!' : 'AMBIL FOTO & ABSEN SEKARANG'}</span>
                                </button>
                            </div>

                        </div>
                    )}
                </div>
            );
        }

        function SuperAdminPortalModule({ stores, employees, setEmployees, showToast }) {
            const [showModal, setShowModal] = useState(false);
            const [formData, setFormData] = useState({
                name: '', role: 'Cashier', storeId: stores[0]?.id || '', isDriver: false, shift: 'Pagi (08:00 - 16:00)', phone: '', salary: 3200000, masterPhoto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400'
            });

            const handleAddStaff = (e) => {
                e.preventDefault();
                const newEmp = {
                    id: `EMP-${Math.floor(100 + Math.random() * 900)}`,
                    ...formData,
                    photoRegisteredAt: new Date().toISOString().replace('T', ' ').substring(0, 19),
                    registeredBy: 'Super Admin HR'
                };
                setEmployees(prev => [...prev, newEmp]);
                setShowModal(false);
                showToast(`Staff ${newEmp.name} berhasil ditambahkan!`, 'success');
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-6 rounded-3xl border border-cream-300 shadow-sm">
                        <div>
                            <h2 className="text-xl font-black text-slate-800">Kelola Master Data Staff</h2>
                            <p className="text-xs text-slate-500">Tambah staff, tentukan status Driver, & foto acuan biometrik</p>
                        </div>
                        <button 
                            onClick={() => setShowModal(true)}
                            className="px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-2"
                        >
                            <span>➕</span> Tambah Staff Baru
                        </button>
                    </div>

                    {/* Table Staff */}
                    <div className="bg-white rounded-3xl border border-cream-300 shadow-sm overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-cream-50 text-[11px] font-extrabold text-slate-500 uppercase border-b border-cream-200">
                                    <th className="p-4">Foto Acuan</th>
                                    <th className="p-4">Nama Staff</th>
                                    <th className="p-4">Jabatan / Role</th>
                                    <th className="p-4">Status Supir</th>
                                    <th className="p-4">Shift Utama</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-cream-200 text-xs">
                                {employees.map(emp => (
                                    <tr key={emp.id} className="hover:bg-cream-50/50">
                                        <td className="p-4">
                                            <img src={emp.masterPhoto} className="w-10 h-10 rounded-xl object-cover border border-cream-300" />
                                        </td>
                                        <td className="p-4 font-bold text-slate-900">{emp.name}</td>
                                        <td className="p-4 font-semibold text-slate-600">{emp.role}</td>
                                        <td className="p-4">
                                            {emp.isDriver ? (
                                                <span className="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-[10px] font-black">
                                                    🚚 SUPIR DIRECT
                                                </span>
                                            ) : (
                                                <span className="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-[10px] font-semibold">
                                                    Staff Regular
                                                </span>
                                            )}
                                        </td>
                                        <td className="p-4 font-mono text-slate-500">{emp.shift}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal Tambah Staff */}
                    {showModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white max-w-md w-full rounded-3xl p-6 border border-cream-300 shadow-2xl space-y-4">
                                <h3 className="font-black text-lg text-slate-800">Tambah Staff Baru</h3>
                                <form onSubmit={handleAddStaff} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold mb-1">Nama Staff</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border rounded-xl p-2.5 bg-cream-50" />
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-1">Role / Jabatan</label>
                                        <input type="text" required value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full border rounded-xl p-2.5 bg-cream-50" />
                                    </div>
                                    <div className="flex items-center gap-2 py-2">
                                        <input type="checkbox" id="isDriver" checked={formData.isDriver} onChange={e => setFormData({...formData, isDriver: e.target.checked})} className="w-4 h-4 rounded" />
                                        <label htmlFor="isDriver" className="font-bold text-amber-900">Apakah Staff Ini Supir / Driver Delivery?</label>
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-1">URL Foto Acuan Master</label>
                                        <input type="text" required value={formData.masterPhoto} onChange={e => setFormData({...formData, masterPhoto: e.target.value})} className="w-full border rounded-xl p-2.5 bg-cream-50" />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowModal(false)} className="w-1/2 py-2.5 border rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="w-1/2 py-2.5 bg-brand-600 text-white rounded-xl font-bold">Simpan Staff</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminDashboardModule({ records, onSelectRecord }) {
            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm">
                        <h2 className="text-xl font-black text-slate-800">Rekap & Audit Presensi AI</h2>
                        <p className="text-xs text-slate-500">Riwayat presensi beserta audit biometrik pencocokan foto</p>
                    </div>

                    <div className="bg-white rounded-3xl border border-cream-300 shadow-sm overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-cream-50 text-[11px] font-extrabold text-slate-500 uppercase border-b border-cream-200">
                                    <th className="p-4">Foto Live</th>
                                    <th className="p-4">Nama Staff</th>
                                    <th className="p-4">Store / Mode</th>
                                    <th className="p-4">Shift</th>
                                    <th className="p-4">Waktu</th>
                                    <th className="p-4">Score AI</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-cream-200 text-xs">
                                {records.map(r => (
                                    <tr key={r.id} className="hover:bg-cream-50/50">
                                        <td className="p-4">
                                            <img src={r.capturedPhoto} className="w-10 h-10 rounded-xl object-cover border border-cream-300" />
                                        </td>
                                        <td className="p-4 font-bold text-slate-900">{r.employeeName}</td>
                                        <td className="p-4 font-medium text-slate-600">{r.storeName}</td>
                                        <td className="p-4 text-slate-500">{r.shiftName || '-'}</td>
                                        <td className="p-4 font-mono text-slate-500">{r.checkIn || r.checkOut}</td>
                                        <td className="p-4 font-black text-emerald-600">{r.confidence}% Match</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
