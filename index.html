            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;

                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3500);

                if (!isOfflineMode && offlineQueue.length > 0) {
                    setAttendanceRecords(prev => [...offlineQueue, ...prev]);
                    showToast(`Berhasil menyinkronkan ${offlineQueue.length} data absensi offline!`, 'success');

                    ]);
                    setOfflineQueue([]);
                }

                const newLog = {
                    id: `AUD-${Math.floor(1000 + Math.random() * 9000)}`,
                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),

                    details

                setIsSuperAdmin(false);

                showToast('Super Admin telah keluar.', 'info');
                logAuditAction('LOGOUT_SUPER_ADMIN', 'Super Admin keluar dari sesi.');

            const exportToCSV = (data, filename) => {
                if (!data || !data.length) {
                    showToast('Tidak ada data untuk diexport!', 'warning');
                    return;
                }
                const headers = Object.keys(data[0]).join(',');
                const rows = data.map(obj => Object.values(obj).map(val => `"${String(val).replace(/"/g, '""')}"`).join(','));
                const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${filename}_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast(`File ${filename}.csv berhasil diunduh!`, 'success');

        function KioskModule({ stores, employees, isOffline, onRecordAttendance, showToast }) {
            const [step, setStep] = useState(1);
            const [attendanceType, setAttendanceType] = useState('CHECK_IN');
            const [selectedEmpId, setSelectedEmpId] = useState(employees[0]?.id || '');
            const [selectedStoreId, setSelectedStoreId] = useState(stores[0]?.id || '');
            const [selectedShift, setSelectedShift] = useState('08:00 - 16:00');
            const [isScanning, setIsScanning] = useState(false);
            const [scanSuccess, setScanSuccess] = useState(false);
            const [lastRecord, setLastRecord] = useState(null);

            const [simulateMismatch, setSimulateMismatch] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [useRealCamera, setUseRealCamera] = useState(false);
            const [cameraStream, setCameraStream] = useState(null);

            const selectedEmp = employees.find(e => e.id === selectedEmpId) || employees[0];
            const selectedStore = stores.find(s => s.id === selectedStoreId) || stores[0];

            useEffect(() => {
                if (selectedEmp) {
                    if (selectedEmp.storeId) setSelectedStoreId(selectedEmp.storeId);
                    if (selectedEmp.shift) setSelectedShift(selectedEmp.shift);
                }
            }, [selectedEmpId]);

            const startWebcam = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    setCameraStream(stream);
                    setUseRealCamera(true);
                } catch (err) {
                    setUseRealCamera(false);
                    showToast('Kamera fisik tidak terdeteksi / ditolak. Menggunakan simulasi kamera Kiosk AI.', 'info');
                }
            };

            const stopWebcam = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    setCameraStream(null);
                }
            };

            useEffect(() => {
                if (step === 2) {
                    startWebcam();
                } else {
                    stopWebcam();
                }
                return () => stopWebcam();
            }, [step]);

            const handleProceedToCamera = () => {
                setStep(2);
                setScanSuccess(false);
            };

            const handleSimulateScan = () => {
                setIsScanning(true);

                let capturedPhotoUrl = selectedEmp?.masterPhoto || '';
                if (useRealCamera && videoRef.current && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const video = videoRef.current;
                    canvas.width = video.videoWidth || 300;
                    canvas.height = video.videoHeight || 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    capturedPhotoUrl = canvas.toDataURL('image/jpeg');
                } else if (simulateMismatch) {
                    capturedPhotoUrl = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400';
                }

                setTimeout(() => {
                    setIsScanning(false);
                    setScanSuccess(true);

                    const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
                    const isLate = attendanceType === 'CHECK_IN' && new Date().getMinutes() > 0;
                    
                    const matchConfidence = simulateMismatch ? 42.1 : Number((96.5 + Math.random() * 3.2).toFixed(1));
                    const isMatched = matchConfidence >= 85.0;

                    const record = {
                        id: `ATT-${Math.floor(1000 + Math.random() * 9000)}`,
                        employeeId: selectedEmp.id,
                        employeeName: selectedEmp.name,
                        masterPhotoRef: selectedEmp.masterPhoto,
                        capturedPhoto: capturedPhotoUrl,
                        storeName: selectedStore.name,
                        role: selectedEmp.role,
                        checkIn: attendanceType === 'CHECK_IN' ? nowStr : '2026-08-02 08:00:00',
                        checkOut: attendanceType === 'CHECK_OUT' ? nowStr : null,
                        attendanceType: attendanceType,
                        isLate: isLate,
                        lateMinutes: isLate ? 15 : 0,
                        confidence: matchConfidence,
                        matchStatus: isMatched ? 'MATCHED' : 'MISMATCH',
                        livenessScore: 97.4,
                        device: `Kiosk Toko (${useRealCamera ? 'Webcam Fisik' : 'Simulasi AI'})`
                    };

                    setLastRecord(record);
                    onRecordAttendance(record);

                    setTimeout(() => {
                        setStep(1);
                        setScanSuccess(false);
                    }, 3800);
                }, 2200);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-gradient-to-r from-brand-700 via-brand-600 to-chocolate-700 text-white p-6 rounded-3xl shadow-lg relative overflow-hidden">

                                </div>

                                {selectedEmp && (
                                    <div className="p-4 bg-cream-50 rounded-2xl border border-cream-200 flex items-center gap-4">
                                        <div className="relative w-16 h-16 rounded-2xl overflow-hidden border-2 border-brand-600 shadow-sm shrink-0 bg-slate-800">
                                            <img src={selectedEmp.masterPhoto} className="w-full h-full object-cover" />

                    ...prev,
                    password: newPasswordInput

        function DriverOvertimeModule({ employees, showToast, logAuditAction }) {
            const drivers = employees.filter(e => e.isDriver || e.role.toLowerCase().includes('driver'));

            const [otLogs, setOtLogs] = useState([
                { id: 'OT-01', driverId: 'EMP-003', driverName: 'I Nyoman Budi (Supir)', tripRoute: 'Gatsu Central -> Renon Outlet -> Teuku Umar', hours: 2, status: 'APPROVED', bonus: 50000, date: '2026-08-02' }
            ]);

            const [selectedDriverId, setSelectedDriverId] = useState(drivers[0]?.id || '');
            const [tripRoute, setTripRoute] = useState('');
            const [otHours, setOtHours] = useState(2);

            const handleAddOtLog = (e) => {
                e.preventDefault();
                const d = drivers.find(dr => dr.id === selectedDriverId) || drivers[0];
                if (!d) {
                    showToast('Tidak ada supir/driver terdaftar.', 'warning');
                    return;
                }

                const bonusPerKmOrHour = otHours * 25000;
                const newOt = {
                    id: `OT-${Math.floor(10 + Math.random() * 90)}`,
                    driverId: d.id,
                    driverName: d.name,
                    tripRoute: tripRoute || 'Pengiriman Antar Outlet Denpasar',
                    hours: Number(otHours),
                    status: 'APPROVED',
                    bonus: bonusPerKmOrHour,
                    date: new Date().toISOString().slice(0, 10)
                };

                setOtLogs(prev => [newOt, ...prev]);
                logAuditAction('ADD_DRIVER_OT', `Lembur driver dicatat: ${d.name} (${otHours} jam - Rp ${bonusPerKmOrHour.toLocaleString('id-ID')})`);
                showToast(`Bonus lembur driver untuk ${d.name} berhasil dicatat!`, 'success');
                setTripRoute('');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-amber-700 via-chocolate-700 to-brand-800 text-white p-6 rounded-3xl shadow-md space-y-2">

                        </div>
                        <h2 className="text-lg font-black">Manajemen Lembur & Antar Outlet Supir Delivery</h2>
                        <p className="text-xs text-cream-100">Lembur driver dihitung otomatis berdasarkan durasi log pengiriman produk puding Bali.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <form onSubmit={handleAddOtLog} className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-4 text-xs">
                            <h3 className="font-extrabold text-base text-slate-800">Tambah Log Lembur Driver</h3>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Pilih Supir / Driver</label>
                                <select 
                                    value={selectedDriverId} 
                                    onChange={(e) => setSelectedDriverId(e.target.value)}
                                    className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 font-bold text-slate-800 outline-none"
                                >
                                    {drivers.map(dr => (
                                        <option key={dr.id} value={dr.id}>{dr.name} ({dr.id})</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Rute Pengiriman / Tugas</label>
                                <input 
                                    type="text" 
                                    placeholder="Contoh: Gatsu -> Outlet Renon"
                                    value={tripRoute}
                                    onChange={(e) => setTripRoute(e.target.value)}
                                    className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 font-semibold text-slate-800 outline-none"
                                    required 
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-1">Durasi Lembur (Jam)</label>
                                <input 
                                    type="number" 
                                    min="1" 
                                    max="10"
                                    value={otHours}
                                    onChange={(e) => setOtHours(e.target.value)}
                                    className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 font-semibold text-slate-800 outline-none"
                                    required 
                                />
                            </div>

                            <div className="p-3 bg-cream-50 rounded-2xl border border-cream-200 text-[11px] space-y-1">
                                <span className="text-slate-500 font-bold">Perhitungan Bonus:</span>
                                <p className="font-mono font-bold text-emerald-700">Rp {(otHours * 25000).toLocaleString('id-ID')} (Rp 25.000 / Jam)</p>
                            </div>

                            <button 
                                type="submit" 
                                className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-2xl shadow-md transition-all"
                            >
                                ➕ Simpan Lembur Driver
                            </button>
                        </form>

                        <div className="lg:col-span-2 bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-4">
                            <h3 className="font-extrabold text-base text-slate-800">Daftar Lembur Terverifikasi</h3>

                            <div className="overflow-x-auto border border-cream-200 rounded-2xl">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-cream-50 text-slate-600 border-b border-cream-200 font-extrabold uppercase">
                                        <tr>
                                            <th className="p-3">Tanggal</th>
                                            <th className="p-3">Nama Supir</th>
                                            <th className="p-3">Rute Pengiriman</th>
                                            <th className="p-3">Durasi</th>
                                            <th className="p-3">Bonus OT</th>
                                            <th className="p-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-cream-200">
                                        {otLogs.map(log => (
                                            <tr key={log.id} className="hover:bg-cream-50">
                                                <td className="p-3 font-mono text-slate-500">{log.date}</td>
                                                <td className="p-3 font-bold text-slate-800">{log.driverName}</td>
                                                <td className="p-3 text-slate-600">{log.tripRoute}</td>
                                                <td className="p-3 font-bold">{log.hours} Jam</td>
                                                <td className="p-3 font-mono font-bold text-emerald-700">Rp {log.bonus.toLocaleString('id-ID')}</td>
                                                <td className="p-3">
                                                    <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-[10px]">
                                                        {log.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PayrollSummaryModule({ records, employees, stores, exportToCSV, onSelectPayslip }) {
            const payrollData = employees.map(emp => {
                const lateCount = records.filter(r => r.employeeId === emp.id && r.isLate).length;
                const deduction = lateCount * 25000;
                const otBonus = emp.isDriver ? 50000 : 0;
                const finalSalary = emp.salary + otBonus - deduction;

                return {
                    ...emp,
                    lateCount,
                    deduction,
                    otBonus,
                    finalSalary
                };
            });

            return (
                <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-cream-200 pb-4">
                        <div>
                            <h2 className="text-lg font-black text-brand-700">💰 Rekap Payroll & Slip Gaji Karyawan</h2>
                            <p className="text-xs text-slate-500">Perhitungan gaji otomatis terintegrasi dengan ketersediaan jam kerja AI Face Match.</p>
                        </div>
                        <button 
                            onClick={() => exportToCSV(payrollData, 'payroll_puding_panen_bali')}
                            className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl text-xs flex items-center gap-1.5 shadow-md transition-all"
                        >
                            <span>📥 Export Payroll CSV</span>
                        </button>
                    </div>

                    <div className="overflow-x-auto border border-cream-200 rounded-2xl">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-cream-50 text-slate-600 border-b border-cream-200 uppercase font-extrabold">
                                <tr>
                                    <th className="p-3">ID & Nama Staff</th>
                                    <th className="p-3">Jabatan</th>
                                    <th className="p-3">Gaji Pokok</th>
                                    <th className="p-3">Bonus Lembur</th>
                                    <th className="p-3">Potongan Absen</th>
                                    <th className="p-3">Take Home Pay</th>
                                    <th className="p-3 text-center">Slip Gaji</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-cream-200">
                                {payrollData.map(item => (
                                    <tr key={item.id} className="hover:bg-cream-50">
                                        <td className="p-3">
                                            <strong className="text-slate-800 text-xs block">{item.name}</strong>
                                            <span className="font-mono text-[10px] text-slate-500">{item.id}</span>
                                        </td>
                                        <td className="p-3 font-semibold text-slate-700">{item.role}</td>
                                        <td className="p-3 font-mono font-bold text-slate-800">Rp {item.salary.toLocaleString('id-ID')}</td>
                                        <td className="p-3 font-mono font-bold text-emerald-700">+ Rp {item.otBonus.toLocaleString('id-ID')}</td>
                                        <td className="p-3 font-mono font-bold text-brand-700">- Rp {item.deduction.toLocaleString('id-ID')}</td>
                                        <td className="p-3 font-mono font-black text-slate-900 text-sm">Rp {item.finalSalary.toLocaleString('id-ID')}</td>
                                        <td className="p-3 text-center">
                                            <button 
                                                onClick={() => onSelectPayslip(item)}
                                                className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold transition-all shadow-sm"
                                            >
                                                📄 Cetak Slip
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
