                if (!isOfflineMode && offlineQueue.length > 0) {
                    setAttendanceRecords(prev => [...offlineQueue, ...prev]);
                    showToast(`Berhasil menyinkronkan ${offlineQueue.length} data absensi offline!`, 'success');

                    ]);
                    setOfflineQueue([]);
                }

                const newLog = {
                    id: `AUD-${Math.floor(1000 + Math.random() * 9000)}`,
                    timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                    user: isSuperAdmin ? 'Super Admin HR' : 'System Kiosk Toko',

                    details

                    setLoginError('');

                    setLoginError('Username/Password Admin salah! (Gunakan demo: admin / admin123)');

                showToast('Super Admin telah keluar.', 'info');
                logAuditAction('LOGOUT_SUPER_ADMIN', 'Super Admin keluar dari sesi.');

            const exportToCSV = (data, filename) => {
                if (!data || !data.length) {
                    showToast('Tidak ada data untuk diexport!', 'warning');
                    return;
                }
                const headers = Object.keys(data[0]).join(',');
                const rows = data.map(obj => Object.values(obj).map(val => `"${String(val).replace(/"/g, '""')}"`).join(','));
                const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `${filename}_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast(`File ${filename}.csv berhasil diunduh!`, 'success');

        function KioskModule({ stores, employees, isOffline, onRecordAttendance, showToast }) {

            const [selectedStoreId, setSelectedStoreId] = useState(stores[0]?.id || '');
            const [selectedShift, setSelectedShift] = useState('08:00 - 16:00');

            const [scanSuccess, setScanSuccess] = useState(false);
            const [lastRecord, setLastRecord] = useState(null);

            // Simulation options for testing Match vs Mismatch
            const [simulateMismatch, setSimulateMismatch] = useState(false);

            // Real Browser WebCam Ref
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [useRealCamera, setUseRealCamera] = useState(false);
            const [cameraStream, setCameraStream] = useState(null);

            const selectedEmp = employees.find(e => e.id === selectedEmpId) || employees[0];
            const selectedStore = stores.find(s => s.id === selectedStoreId) || stores[0];

            useEffect(() => {
                if (selectedEmp) {
                    if (selectedEmp.storeId) setSelectedStoreId(selectedEmp.storeId);
                    if (selectedEmp.shift) setSelectedShift(selectedEmp.shift);
                }
            }, [selectedEmpId]);

            const startWebcam = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    setCameraStream(stream);
                    setUseRealCamera(true);
                } catch (err) {
                    console.log("Webcam access unavailable or denied, falling back to simulated camera mode.", err);
                    setUseRealCamera(false);
                    showToast('Kamera fisik tidak terdeteksi / ditolak. Menggunakan simulasi kamera Kiosk AI.', 'info');
                }
            };

            const stopWebcam = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    setCameraStream(null);
                }
            };

            useEffect(() => {
                if (step === 2) {
                    startWebcam();
                } else {
                    stopWebcam();
                }
                return () => stopWebcam();
            }, [step]);

            const handleProceedToCamera = () => {
                setStep(2);
                setScanSuccess(false);
            };

            const handleSimulateScan = () => {
                setIsScanning(true);

                // Capture snapshot if using real camera
                let capturedPhotoUrl = selectedEmp.masterPhoto;
                if (useRealCamera && videoRef.current && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const video = videoRef.current;
                    canvas.width = video.videoWidth || 300;
                    canvas.height = video.videoHeight || 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    capturedPhotoUrl = canvas.toDataURL('image/jpeg');
                } else if (simulateMismatch) {
                    capturedPhotoUrl = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400';
                }

                setTimeout(() => {
                    setIsScanning(false);
                    setScanSuccess(true);

                    const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);
                    const isLate = attendanceType === 'CHECK_IN' && new Date().getMinutes() > 0;
                    
                    const matchConfidence = simulateMismatch ? 42.1 : Number((96.5 + Math.random() * 3.2).toFixed(1));
                    const isMatched = matchConfidence >= 85.0;

                    const record = {
                        id: `ATT-${Math.floor(1000 + Math.random() * 9000)}`,
                        employeeId: selectedEmp.id,
                        employeeName: selectedEmp.name,
                        masterPhotoRef: selectedEmp.masterPhoto,
                        capturedPhoto: capturedPhotoUrl,
                        storeName: selectedStore.name,
                        role: selectedEmp.role,
                        checkIn: attendanceType === 'CHECK_IN' ? nowStr : '2026-08-02 08:00:00',
                        checkOut: attendanceType === 'CHECK_OUT' ? nowStr : null,
                        attendanceType: attendanceType,
                        isLate: isLate,
                        lateMinutes: isLate ? 15 : 0,
                        confidence: matchConfidence,
                        matchStatus: isMatched ? 'MATCHED' : 'MISMATCH',
                        livenessScore: 97.4,
                        device: `Kiosk Toko (${useRealCamera ? 'Webcam Fisik' : 'Simulasi AI'})`
                    };

                    setLastRecord(record);
                    onRecordAttendance(record);

                    setTimeout(() => {
                        setStep(1);
                        setScanSuccess(false);
                    }, 3800);
                }, 2200);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">

                                                        r.attendanceType === 'CHECK_IN' ? 'bg-emerald-100 text-emerald-800' : 'bg-brand-100 text-brand-800'
                                                    }`}>
                                                        {r.attendanceType === 'CHECK_IN' ? 'MASUK' : 'PULANG'}
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <span className={`font-mono font-bold px-2 py-0.5 rounded text-[10px] ${
                                                        r.matchStatus === 'MATCHED' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                                    }`}>
                                                        {r.confidence}% Match ({r.matchStatus})
                                                    </span>
                                                </td>
                                                <td className="p-3">
                                                    <button className="px-2.5 py-1 bg-cream-200 hover:bg-cream-300 text-slate-700 font-bold rounded-lg text-[10px]">
                                                        🔎 Buka Audit
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Notifications Side Pane */}
                        <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-4">
                            <h3 className="font-extrabold text-base text-slate-800">Notifikasi System</h3>
                            <div className="space-y-3 text-xs">
                                {notifications.map(n => (
                                    <div key={n.id} className="p-3 rounded-2xl bg-cream-50 border border-cream-200 space-y-1">
                                        <div className="flex justify-between items-center font-bold text-slate-800">
                                            <span>{n.title}</span>
                                            <span className="text-[10px] text-slate-400 font-normal">{n.time}</span>
                                        </div>
                                        <p className="text-slate-600 text-[11px]">{n.message}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function DriverOvertimeModule() {
            const [schedIn, setSchedIn] = useState('11:00');
            const [schedOut, setSchedOut] = useState('20:00');
            const [actualIn, setActualIn] = useState('09:45');
            const [actualOut, setActualOut] = useState('21:30');

            const calculateOT = () => {
                const [sInH, sInM] = schedIn.split(':').map(Number);
                const [sOutH, sOutM] = schedOut.split(':').map(Number);
                const [aInH, aInM] = actualIn.split(':').map(Number);
                const [aOutH, aOutM] = actualOut.split(':').map(Number);

                const earlyInMins = (sInH * 60 + sInM) - (aInH * 60 + aInM);
                const methodAEarly = earlyInMins >= 60 ? Math.floor(earlyInMins / 60) : 0;

                const lateOutMins = (aOutH * 60 + aOutM) - (sOutH * 60 + sOutM);
                const methodALate = lateOutMins >= 60 ? Math.floor(lateOutMins / 60) : 0;

                const methodATotal = methodAEarly + methodALate;

                const totalWorkedMins = (aOutH * 60 + aOutM) - (aInH * 60 + aInM);
                const totalWorkedHours = totalWorkedMins / 60;
                const methodBTotal = totalWorkedHours > 9 ? Math.floor(totalWorkedHours - 9) : 0;

                return {
                    methodA: methodATotal,
                    methodB: methodBTotal,
                    totalWorkedHours: totalWorkedHours.toFixed(1),
                    winner: methodATotal >= methodBTotal ? 'Metode A' : 'Metode B',
                    finalOT: Math.max(methodATotal, methodBTotal)
                };
            };

            const result = calculateOT();

            return (
                <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-6 max-w-3xl mx-auto">
                    <div>
                        <h2 className="text-lg font-black text-brand-700">🚚 Kalkulator Lembur Supir / Driver Delivery</h2>
                        <p className="text-xs text-slate-500">Kalkulasi lembur otomatis berdasarkan presensi jam datang & pulang supir Puding Panen Bali.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div className="p-4 bg-cream-50 rounded-2xl border border-cream-200 space-y-3">
                            <h4 className="font-bold text-slate-800">1. Shift Resmi Driver</h4>
                            <div>
                                <label className="block text-slate-600 mb-1">Jam Masuk Shift</label>
                                <input type="time" value={schedIn} onChange={(e) => setSchedIn(e.target.value)} className="w-full p-2 bg-white border rounded-xl" />
                            </div>
                            <div>
                                <label className="block text-slate-600 mb-1">Jam Pulang Shift</label>
                                <input type="time" value={schedOut} onChange={(e) => setSchedOut(e.target.value)} className="w-full p-2 bg-white border rounded-xl" />
                            </div>
                        </div>

                        <div className="p-4 bg-cream-50 rounded-2xl border border-cream-200 space-y-3">
                            <h4 className="font-bold text-slate-800">2. Hasil Foto Absen Kiosk</h4>
                            <div>
                                <label className="block text-slate-600 mb-1">Jam Datang Live</label>
                                <input type="time" value={actualIn} onChange={(e) => setActualIn(e.target.value)} className="w-full p-2 bg-white border rounded-xl" />
                            </div>
                            <div>
                                <label className="block text-slate-600 mb-1">Jam Pulang Live</label>
                                <input type="time" value={actualOut} onChange={(e) => setActualOut(e.target.value)} className="w-full p-2 bg-white border rounded-xl" />
                            </div>
                        </div>
                    </div>

                    <div className="p-5 bg-brand-50 border border-brand-200 rounded-2xl space-y-3 text-xs">
                        <h4 className="font-black text-brand-800 text-sm">Hasil Kalkulasi Lembur Driver:</h4>
                        <div className="grid grid-cols-2 gap-2 text-slate-700">
                            <div>Metode A (Datang Awal + Pulang Akhir): <strong>{result.methodA} Jam</strong></div>
                            <div>Metode B (Total Jam &gt; 9 Jam): <strong>{result.methodB} Jam</strong></div>
                            <div>Total Waktu Kerja: <strong>{result.totalWorkedHours} Jam</strong></div>
                            <div className="text-brand-700 font-bold">Lembur Disetujui: {result.finalOT} Jam ({result.winner})</div>
                        </div>
                    </div>
                </div>
            );
        }

        function PayrollSummaryModule({ records, employees, exportToCSV, onSelectPayslip }) {
            return (
                <div className="bg-white p-6 rounded-3xl border border-cream-300 shadow-sm space-y-6">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-lg font-black text-brand-700">💰 Summary Payroll & Insentif Staff</h2>
                            <p className="text-xs text-slate-500">Rekapitulasi gaji pokok, bonus lembur, dan potongan berdasarkan presensi terverifikasi.</p>
                        </div>
                        <button 
                            onClick={() => exportToCSV(employees.map(e => ({ ID: e.id, Nama: e.name, Jabatan: e.role, Gaji: e.salary })), 'payroll_puding_panen_bali')}
                            className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md"
                        >
                            📥 Export CSV Payroll
                        </button>
                    </div>

                    <div className="overflow-x-auto text-xs">
                        <table className="w-full text-left">
                            <thead className="bg-cream-50 text-slate-600 border-b border-cream-200">
                                <tr>
                                    <th className="p-3">Karyawan</th>
                                    <th className="p-3">Gaji Pokok</th>
                                    <th className="p-3">Presensi AI Valid</th>
                                    <th className="p-3">Jam Lembur</th>
                                    <th className="p-3">Total Gaji (THP)</th>
                                    <th className="p-3">Aksi Cetak</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-cream-200">
                                {employees.map(emp => {
                                    const empRecords = records.filter(r => r.employeeId === emp.id);
                                    const otHours = empRecords.reduce((acc, curr) => acc + (curr.overtimeHours || 0), 0);
                                    const lateCount = empRecords.filter(r => r.isLate).length;
                                    const deduction = lateCount * 25000;
                                    const otBonus = otHours * 20000;
                                    const finalSalary = emp.salary + otBonus - deduction;

                                    const payslipData = { ...emp, otBonus, deduction, finalSalary };

                                    return (
                                        <tr key={emp.id} className="hover:bg-cream-50 font-mono">
                                            <td className="p-3 font-sans font-bold text-slate-800">{emp.name}</td>
                                            <td className="p-3">Rp {emp.salary.toLocaleString('id-ID')}</td>
                                            <td className="p-3 text-emerald-600 font-bold">{empRecords.length} Hari Valid</td>
                                            <td className="p-3 text-emerald-600 font-bold">+{otHours} Jam</td>
                                            <td className="p-3 font-extrabold text-slate-900 text-sm">Rp {finalSalary.toLocaleString('id-ID')}</td>
                                            <td className="p-3 font-sans">
                                                <button 
                                                    onClick={() => onSelectPayslip(payslipData)}
                                                    className="px-3 py-1 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg text-[10px] shadow-sm"
                                                >
                                                    🖨️ Cetak Slip
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
