<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puding Panen Bali - Sistem Absensi & Manajemen Multi-Outlet</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 90%; opacity: 0.3; }
            100% { top: 0%; opacity: 0.8; }
        }
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, rgba(34,197,94,0) 0%, rgba(34,197,94,1) 50%, rgba(34,197,94,0) 100%);
            box-shadow: 0 0 15px #22c55e;
            animation: scan 2.5s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .pulse-border-rose {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen selection:bg-amber-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Default Supabase Credentials for Puding Panen Bali
        const DEFAULT_SUPABASE_URL = 'https://fqaqqaruktvgpfsiwlkp.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'sb_publishable_vxVqvMbaXlq1Lk5zlIAzeg_QCoZmobc';

        const sanitizeUrl = (url) => {
            if (!url) return '';
            return url.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        };

        const INITIAL_STORES = [
            { id: 'S1', code: 'OUT-01', name: 'Outlet Seminyak', address: 'Jl. Kayu Aya No. 12, Seminyak' },
            { id: 'S2', code: 'OUT-02', name: 'Outlet Ubud', address: 'Jl. Raya Ubud No. 45, Ubud' },
            { id: 'S3', code: 'OUT-03', name: 'Outlet Canggu', address: 'Jl. Pantai Batu Bolong, Canggu' },
            { id: 'S4', code: 'CK-01', name: 'Central Kitchen Denpasar', address: 'Jl. Teuku Umar No. 88, Denpasar' }
        ];

        const INITIAL_EMPLOYEES = [
            { id: 'EMP001', name: 'Wayan Sudiarta', phone: '081234567890', role: 'Store Manager', storeId: 'S1', shift: 'Shift Pagi (07:00 - 15:00)', isDriver: false, masterPhoto: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80' },
            { id: 'EMP002', name: 'Made Agus Supir', phone: '081999888777', role: 'Driver Logistic', storeId: 'S4', shift: 'Shift Full (08:00 - 20:00)', isDriver: true, masterPhoto: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&auto=format&fit=crop&q=80' },
            { id: 'EMP003', name: 'Kadek Putri', phone: '085777666555', role: 'Kasir', storeId: 'S2', shift: 'Shift Siang (14:00 - 22:00)', isDriver: false, masterPhoto: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&auto=format&fit=crop&q=80' },
            { id: 'EMP004', name: 'Ketut Budi', phone: '082111222333', role: 'Supir Pengiriman', storeId: 'S4', shift: 'Shift Pagi (07:00 - 15:00)', isDriver: true, masterPhoto: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&auto=format&fit=crop&q=80' }
        ];

        const INITIAL_ROLES = [
            'Store Manager',
            'Kasir',
            'Staff Dapur',
            'Driver Logistic',
            'Supir Pengiriman'
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('kiosk');
            const [isSuperAdmin, setIsSuperAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [showConfigModal, setShowConfigModal] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState('');
            const [adminPin, setAdminPin] = useState(localStorage.getItem('ADMIN_PIN') || '1234');

            // Change PIN State
            const [showChangePinModal, setShowChangePinModal] = useState(false);
            const [pinForm, setPinForm] = useState({ oldPin: '', newPin: '', confirmPin: '' });
            const [pinNotice, setPinNotice] = useState({ type: '', msg: '' });

            // Supabase Database States
            const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('SUPABASE_URL') || DEFAULT_SUPABASE_URL);
            const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('SUPABASE_KEY') || DEFAULT_SUPABASE_KEY);
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [isConnected, setIsConnected] = useState(false);

            // Application Data States
            const [stores, setStores] = useState(INITIAL_STORES);
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [roles, setRoles] = useState(INITIAL_ROLES);
            const [attendanceRecords, setAttendanceRecords] = useState([]);

            // Kiosk Selection Flow States
            const [selectedEmpId, setSelectedEmpId] = useState('');
            const [selectedStoreId, setSelectedStoreId] = useState('S1');
            const [selectedShift, setSelectedShift] = useState('Shift Pagi (07:00 - 15:00)');
            const [attendanceType, setAttendanceType] = useState('CHECK_IN');
            const [kioskStep, setKioskStep] = useState(1);

            // Late Warning Modal States
            const [showLateModal, setShowLateModal] = useState(false);
            const [hasFilledLateForm, setHasFilledLateForm] = useState(false);
            const [lateMinutesCount, setLateMinutesCount] = useState(0);
            const [lateWarningAlert, setLateWarningAlert] = useState('');

            // Camera & Verification State
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [capturedPhoto, setCapturedPhoto] = useState(null);
            const [isVerifying, setIsVerifying] = useState(false);
            const [verificationResult, setVerificationResult] = useState(null);

            // Staff Management Modal & Photo Source States
            const [showStaffModal, setShowStaffModal] = useState(false);
            const [editingEmp, setEditingEmp] = useState(null);
            const [deleteConfirmEmp, setDeleteConfirmEmp] = useState(null);
            const [photoSourceType, setPhotoSourceType] = useState('file'); // 'file' or 'url'
            const [empForm, setEmpForm] = useState({
                name: '', phone: '', role: 'Kasir', storeId: 'S1', shift: 'Shift Pagi (07:00 - 15:00)', isDriver: false, masterPhoto: ''
            });

            // Store Management Modal States
            const [showStoreModal, setShowStoreModal] = useState(false);
            const [editingStore, setEditingStore] = useState(null);
            const [deleteConfirmStore, setDeleteConfirmStore] = useState(null);
            const [storeForm, setStoreForm] = useState({ code: '', name: '', address: '' });

            // Jabatan Management Modal States
            const [showRoleModal, setShowRoleModal] = useState(false);
            const [editingRoleIndex, setEditingRoleIndex] = useState(null);
            const [deleteConfirmRole, setDeleteConfirmRole] = useState(null);
            const [roleForm, setRoleForm] = useState({ oldName: '', name: '' });

            const videoRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                const cleanUrl = sanitizeUrl(supabaseUrl);
                if (cleanUrl && supabaseKey && window.supabase) {
                    try {
                        const client = window.supabase.createClient(cleanUrl, supabaseKey);
                        setSupabaseClient(client);
                        setIsConnected(true);
                        localStorage.setItem('SUPABASE_URL', cleanUrl);
                        localStorage.setItem('SUPABASE_KEY', supabaseKey);
                    } catch (err) {
                        console.error('Supabase Connection Error:', err);
                        setIsConnected(false);
                    }
                }
            }, [supabaseUrl, supabaseKey]);

            const calculateLateMinutes = (shiftString) => {
                const now = new Date();
                let startHour = 7;
                let startMinute = 0;

                if (shiftString.includes('14:00')) {
                    startHour = 14;
                } else if (shiftString.includes('08:00')) {
                    startHour = 8;
                } else if (shiftString.includes('07:00')) {
                    startHour = 7;
                } else {
                    const match = shiftString.match(/(\d{2}):(\d{2})/);
                    if (match) {
                        startHour = parseInt(match[1], 10);
                        startMinute = parseInt(match[2], 10);
                    }
                }

                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const shiftMinutes = startHour * 60 + startMinute;
                const lateDiff = currentMinutes - shiftMinutes;

                return lateDiff > 0 ? lateDiff : 0;
            };

            const handleProceedToCamera = () => {
                if (!selectedEmpId) {
                    alert('Mohon pilih nama karyawan terlebih dahulu!');
                    return;
                }
                if (!selectedStoreId) {
                    alert('Mohon pilih store / outlet lokasi kerja hari ini!');
                    return;
                }

                if (attendanceType === 'CHECK_IN') {
                    const lateMins = calculateLateMinutes(selectedShift);
                    if (lateMins > 0 && !hasFilledLateForm) {
                        setLateMinutesCount(lateMins);
                        setLateWarningAlert('');
                        setShowLateModal(true);
                        return;
                    }
                }

                setKioskStep(2);
                startCamera();
            };

            const handleConfirmLateForm = (isYes) => {
                if (isYes) {
                    setHasFilledLateForm(true);
                    setShowLateModal(false);
                    setLateWarningAlert('');
                    setKioskStep(2);
                    startCamera();
                } else {
                    setLateWarningAlert('⚠️ Kamu HARUS mengisi Form Datang Terlambat di WhatsApp Group terlebih dahulu! Setelah diisi, klik "Ya, Sudah Isi" untuk melanjutkan.');
                }
            };

            const startCamera = async () => {
                setIsCameraActive(true);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.error("Gagal membuka kamera:", err);
                }
            };

            const captureAndVerify = () => {
                if (!videoRef.current || !canvasRef.current) return;
                const context = canvasRef.current.getContext('2d');
                canvasRef.current.width = videoRef.current.videoWidth || 640;
                canvasRef.current.height = videoRef.current.videoHeight || 480;
                context.drawImage(videoRef.current, 0, 0, canvasRef.current.width, canvasRef.current.height);
                
                const photoData = canvasRef.current.toDataURL('image/jpeg');
                setCapturedPhoto(photoData);

                if (videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                setIsCameraActive(false);

                setIsVerifying(true);
                setTimeout(() => {
                    setIsVerifying(false);
                    const selectedEmp = employees.find(e => e.id === selectedEmpId);
                    const selectedStore = stores.find(s => s.id === selectedStoreId);
                    const lateMins = calculateLateMinutes(selectedShift);
                    const isLate = attendanceType === 'CHECK_IN' && lateMins > 0;

                    const record = {
                        id: 'ATT-' + Date.now(),
                        employee_id: selectedEmp?.id || 'EMP-UNKNOWN',
                        employee_name: selectedEmp?.name || 'Staff',
                        master_photo_ref: selectedEmp?.masterPhoto || '',
                        captured_photo: photoData,
                        store_name: selectedStore?.name || 'Outlet Seminyak',
                        shift: selectedShift,
                        role: selectedEmp?.role || 'Staff',
                        check_in: attendanceType === 'CHECK_IN' ? new Date().toISOString() : null,
                        check_out: attendanceType === 'CHECK_OUT' ? new Date().toISOString() : null,
                        attendance_type: attendanceType,
                        is_late: isLate,
                        late_minutes: lateMins,
                        confidence: 98.4,
                        match_status: 'MATCHED',
                        liveness_score: 0.99,
                        device: navigator.userAgent.includes('Mobile') ? 'Mobile Device' : 'Desktop Kiosk',
                        created_at: new Date().toISOString()
                    };

                    setAttendanceRecords(prev => [record, ...prev]);
                    setVerificationResult(record);

                    if (window.confetti) {
                        window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                    }
                }, 1500);
            };

            const resetKioskFlow = () => {
                setKioskStep(1);
                setSelectedEmpId('');
                setHasFilledLateForm(false);
                setCapturedPhoto(null);
                setVerificationResult(null);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPinInput === adminPin) {
                    setIsSuperAdmin(true);
                    setShowLoginModal(false);
                    setAdminPinInput('');
                } else {
                    alert('PIN Admin Salah! Gunakan PIN standar 1234');
                }
            };

            const handleChangePin = (e) => {
                e.preventDefault();
                if (pinForm.oldPin !== adminPin) {
                    setPinNotice({ type: 'error', msg: 'PIN Lama tidak cocok!' });
                    return;
                }
                if (pinForm.newPin.length < 4) {
                    setPinNotice({ type: 'error', msg: 'PIN Baru minimal 4 karakter!' });
                    return;
                }
                if (pinForm.newPin !== pinForm.confirmPin) {
                    setPinNotice({ type: 'error', msg: 'Konfirmasi PIN Baru tidak sesuai!' });
                    return;
                }

                setAdminPin(pinForm.newPin);
                localStorage.setItem('ADMIN_PIN', pinForm.newPin);
                setPinNotice({ type: 'success', msg: 'PIN Admin berhasil diperbarui!' });
                setTimeout(() => {
                    setShowChangePinModal(false);
                    setPinForm({ oldPin: '', newPin: '', confirmPin: '' });
                    setPinNotice({ type: '', msg: '' });
                }, 1200);
            };

            const openAddStaffModal = () => {
                setEditingEmp(null);
                setPhotoSourceType('file');
                setEmpForm({ name: '', phone: '', role: roles[0] || 'Kasir', storeId: stores[0]?.id || 'S1', shift: 'Shift Pagi (07:00 - 15:00)', isDriver: false, masterPhoto: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80' });
                setShowStaffModal(true);
            };

            const openEditStaffModal = (emp) => {
                setEditingEmp(emp);
                setPhotoSourceType('url');
                setEmpForm({ name: emp.name, phone: emp.phone, role: emp.role, storeId: emp.storeId, shift: emp.shift, isDriver: emp.isDriver, masterPhoto: emp.masterPhoto });
                setShowStaffModal(true);
            };

            const handlePhotoFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        alert('Ukuran file foto terlalu besar! Maksimal 5MB.');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setEmpForm(prev => ({ ...prev, masterPhoto: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveStaff = (e) => {
                e.preventDefault();
                if (!empForm.name) return;

                if (editingEmp) {
                    setEmployees(prev => prev.map(emp => emp.id === editingEmp.id ? { ...emp, ...empForm } : emp));
                } else {
                    const newEmp = { id: 'EMP' + Date.now().toString().slice(-4), ...empForm };
                    setEmployees(prev => [newEmp, ...prev]);
                }
                setShowStaffModal(false);
            };

            const handleDeleteStaff = (empId) => {
                setEmployees(prev => prev.filter(e => e.id !== empId));
                setDeleteConfirmEmp(null);
            };

            const openAddStoreModal = () => {
                setEditingStore(null);
                setStoreForm({ code: `OUT-0${stores.length + 1}`, name: '', address: '' });
                setShowStoreModal(true);
            };

            const openEditStoreModal = (st) => {
                setEditingStore(st);
                setStoreForm({ code: st.code, name: st.name, address: st.address });
                setShowStoreModal(true);
            };

            const handleSaveStore = (e) => {
                e.preventDefault();
                if (!storeForm.name || !storeForm.code) return;

                if (editingStore) {
                    setStores(prev => prev.map(s => s.id === editingStore.id ? { ...s, ...storeForm } : s));
                } else {
                    const newStore = { id: 'S' + Date.now().toString().slice(-4), ...storeForm };
                    setStores(prev => [...prev, newStore]);
                }
                setShowStoreModal(false);
            };

            const handleDeleteStore = (stId) => {
                setStores(prev => prev.filter(s => s.id !== stId));
                setDeleteConfirmStore(null);
            };

            const openAddRoleModal = () => {
                setEditingRoleIndex(null);
                setRoleForm({ oldName: '', name: '' });
                setShowRoleModal(true);
            };

            const openEditRoleModal = (index, roleName) => {
                setEditingRoleIndex(index);
                setRoleForm({ oldName: roleName, name: roleName });
                setShowRoleModal(true);
            };

            const handleSaveRole = (e) => {
                e.preventDefault();
                const trimmed = roleForm.name.trim();
                if (!trimmed) return;

                if (editingRoleIndex !== null) {
                    const oldRoleName = roles[editingRoleIndex];
                    setRoles(prev => prev.map((r, idx) => idx === editingRoleIndex ? trimmed : r));
                    setEmployees(prev => prev.map(emp => emp.role === oldRoleName ? { ...emp, role: trimmed } : emp));
                } else {
                    if (roles.includes(trimmed)) {
                        alert('Jabatan ini sudah ada dalam daftar!');
                        return;
                    }
                    setRoles(prev => [...prev, trimmed]);
                }
                setShowRoleModal(false);
            };

            const handleDeleteRole = (roleToDelete) => {
                setRoles(prev => prev.filter(r => r !== roleToDelete));
                setDeleteConfirmRole(null);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white font-black text-xl shadow-md">
                                    🍮
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-slate-900 text-lg sm:text-xl tracking-tight">Puding Panen Bali</h1>
                                    <p className="text-xs text-slate-500 font-medium">Sistem Absensi AI & Management Multi-Outlet</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 sm:space-x-3">
                                <button 
                                    onClick={() => setShowConfigModal(true)}
                                    className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-2 transition-all border ${
                                        isConnected 
                                            ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' 
                                            : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                                    }`}
                                >
                                    <span className={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                    <span>{isConnected ? 'Database Online' : 'Database Offline'}</span>
                                    <i className="fa-solid fa-gear text-xs ml-1 opacity-70"></i>
                                </button>

                                {isSuperAdmin ? (
                                    <div className="flex items-center space-x-2">
                                        <span className="bg-amber-100 text-amber-800 text-xs px-3 py-1.5 rounded-lg font-bold border border-amber-300 flex items-center gap-1.5">
                                            <i className="fa-solid fa-user-shield"></i> Super Admin Mode
                                        </span>
                                        <button 
                                            onClick={() => setShowChangePinModal(true)}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold border border-slate-300 transition-all flex items-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-key text-xs"></i>
                                            <span>Ganti PIN</span>
                                        </button>
                                        <button 
                                            onClick={() => { setIsSuperAdmin(false); setActiveTab('kiosk'); }}
                                            className="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-2.5 py-1.5 rounded-lg font-bold border border-rose-200 transition-all"
                                        >
                                            Keluar
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowLoginModal(true)}
                                        className="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold transition-all shadow-sm flex items-center space-x-1.5"
                                    >
                                        <i className="fa-solid fa-lock text-xs"></i>
                                        <span>Login Admin</span>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-100 flex space-x-2 sm:space-x-6 overflow-x-auto">
                            <button 
                                onClick={() => setActiveTab('kiosk')}
                                className={`py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap transition-all flex items-center space-x-2 ${
                                    activeTab === 'kiosk' 
                                        ? 'border-amber-500 text-amber-600' 
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <i className="fa-solid fa-camera"></i>
                                <span>Kiosk Absensi AI</span>
                            </button>

                            {/* Restricted Admin Tabs */}
                            {isSuperAdmin && (
                                <>
                                    <button 
                                        onClick={() => setActiveTab('reports')}
                                        className={`py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap transition-all flex items-center space-x-2 ${
                                            activeTab === 'reports' 
                                                ? 'border-amber-500 text-amber-600' 
                                                : 'border-transparent text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <i className="fa-solid fa-chart-line"></i>
                                        <span>Laporan Absensi ({attendanceRecords.length})</span>
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('staff')}
                                        className={`py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap transition-all flex items-center space-x-2 ${
                                            activeTab === 'staff' 
                                                ? 'border-amber-500 text-amber-600' 
                                                : 'border-transparent text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <i className="fa-solid fa-users"></i>
                                        <span>Kelola Staff ({employees.length})</span>
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('stores')}
                                        className={`py-3 text-xs sm:text-sm font-bold border-b-2 whitespace-nowrap transition-all flex items-center space-x-2 ${
                                            activeTab === 'stores' 
                                                ? 'border-amber-500 text-amber-600' 
                                                : 'border-transparent text-slate-500 hover:text-slate-800'
                                        }`}
                                    >
                                        <i className="fa-solid fa-store"></i>
                                        <span>Kelola Store ({stores.length})</span>
                                    </button>

                                    <button
